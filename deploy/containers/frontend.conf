server {
    listen 127.0.0.1:18094;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 4m;

    location = /healthz { access_log off; return 200 "ready\n"; }

    location = /_frontend_auth {
        internal;
        proxy_pass http://127.0.0.1:18093/v1/accounts;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    location = / {
        auth_request /_frontend_auth;
        error_page 401 403 = @public_landing;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location @public_landing { proxy_pass http://127.0.0.1:18093; }

    location ~ ^/(mcp|v1/conversations/[^/]+/uploads)$ {
        client_max_body_size 1400m;
        proxy_pass http://127.0.0.1:18093;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:18093;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
