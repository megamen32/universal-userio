<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Встречи Телемоста — UserIO</title>
<style>body{font:17px system-ui;background:#101820;color:#e8f0f6;max-width:800px;margin:40px auto;padding:20px}a{color:#71c5ff}input,button{font:inherit;border-radius:12px;padding:14px;margin:6px 0;box-sizing:border-box}input[type=url]{width:100%}button{background:#3887de;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}article{background:#1c2b39;padding:20px;border-radius:16px;margin:18px 0}audio{width:100%}.error{color:#ffac9c}label{display:block}pre{white-space:pre-wrap}h1{font-size:32px}</style>
<a href="/">← Личный кабинет</a><h1>Запись встречи Телемоста</h1><p>Секретарь входит как видимый участник. Микрофон и камера выключены. После встречи здесь появятся аудио и расшифровка.</p>
<form id="start"><label>Ссылка на встречу<input id="url" type="url" placeholder="https://telemost.yandex.ru/j/…" required></label><label>Предельная длительность <select id="duration"><option value="3600">1 час</option><option value="7200">2 часа</option><option value="120">2 минуты — проверка</option></select></label><label><input type="checkbox" id="confirmed" required> Записать эту встречу; участники знают о записи</label><button>Подключиться и записывать</button></form><p id="error" class="error" role="alert"></p><section id="meetings"></section>
<script>
const api='/v1/meetings/telemost',states={submitting:'Подключаемся',accepted:'Подключаемся',waiting:'Ожидаем допуска организатора',recording:'Записываем',finalizing:'Сохраняем аудио',recorded:'Запись завершена',failed:'Подключение не удалось',no_audio:'Звук не получен',cancelled:'Отменено',expired:'Время ожидания истекло',unknown:'Результат подключения неизвестен — повтор не выполняется'};
let requestId=null,requestURL=null;
async function request(path,options){let response=await fetch(path,options);if(response.status===401)throw Error('Войдите в личный кабинет UserIO, затем вернитесь сюда.');let data=await response.json();if(!response.ok)throw Error(data.error||'Не удалось выполнить запрос');return data}
function node(tag,text,parent){let e=document.createElement(tag);if(text)e.textContent=text;parent.append(e);return e}
async function refresh(){try{let data=await request(api);let root=document.getElementById('meetings');root.replaceChildren();for(let record of data.meetings){let article=node('article','',root);node('h2',states[record.status]||record.status,article);node('p',new Date(record.started_at*1000).toLocaleString('ru-RU'),article);let a=node('a','Открыть встречу',article);a.href=record.url;a.target='_blank';a.rel='noopener';if(['accepted','waiting','recording'].includes(record.status)){let b=node('button','Остановить запись',article);b.onclick=async()=>{b.disabled=true;try{await request(api+'/'+record.id+'/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});await refresh()}catch(e){document.getElementById('error').textContent=e.message}}}if(record.partial)node('p','Запись неполная: доступные фрагменты сохранены.',article);for(let track of record.tracks||[]){node('h3',track.label,article);if(track.archived){let audio=node('audio','',article);audio.controls=true;audio.preload='none';audio.src=api+'/'+record.id+'/audio/'+track.index;let download=node('a','Скачать WAV',article);download.href=audio.src;download.download=track.filename}for(let segment of track.transcripts||[])node('pre',Math.floor(segment.offset/60)+':'+String(Math.floor(segment.offset%60)).padStart(2,'0')+' '+segment.text,article);if(track.transcription_status==='failed')node('p','Аудио сохранено, расшифровка недоступна.',article)}if(record.chat_supported===false)node('p','Чат встречи ещё не подключён.',article)}}catch(e){document.getElementById('error').textContent=e.message}}
document.getElementById('start').onsubmit=async event=>{event.preventDefault();let button=event.target.querySelector('button');button.disabled=true;let url=document.getElementById('url').value;if(requestURL!==url){requestId=crypto.randomUUID();requestURL=url}try{await request(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,request_id:requestId,confirm:document.getElementById('confirmed').checked,max_seconds:Number(document.getElementById('duration').value)})});document.getElementById('error').textContent='';await refresh()}catch(e){document.getElementById('error').textContent=e.message}finally{button.disabled=false}};refresh();setInterval(refresh,5000);
</script></html>
