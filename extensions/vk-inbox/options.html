<!doctype html><meta charset="utf-8"><title>VK Inbox settings</title>
<style>body{font:16px system-ui;max-width:680px;margin:40px auto;padding:0 20px}input{display:block;width:100%;padding:9px;margin:6px 0 16px;box-sizing:border-box}button{padding:9px 18px}</style>
<h1>VK Inbox connector</h1><p>Расширение использует уже открытую VK-сессию. Токен VK не извлекается и не отправляется.</p>

<label>UserIO API token (необязательно, хранится только в этом профиле Chrome)<input id="token" type="password" autocomplete="off"></label>
<button id="save">Сохранить</button><span id="status"></span><script src="options.js"></script>
