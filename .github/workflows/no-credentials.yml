name: No credentials in the public repository

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fail when a credential is committed
        run: python3 scripts/validate_no_credentials.py
      - name: Validate the Agent Plugin package
        run: python3 scripts/validate_agent_plugin.py
