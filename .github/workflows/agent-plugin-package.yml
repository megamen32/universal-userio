name: Agent Plugin package

on:
  pull_request:
    paths:
      - "plugin.json"
      - "mcp.json"
      - "skills/userio/SKILL.md"
      - "plugins/universal-userio/**"
      - "scripts/validate_agent_plugin.py"
      - ".github/workflows/agent-plugin-package.yml"
  push:
    branches: [main]
    paths:
      - "plugin.json"
      - "mcp.json"
      - "skills/userio/SKILL.md"
      - "plugins/universal-userio/**"
      - "scripts/validate_agent_plugin.py"
      - ".github/workflows/agent-plugin-package.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/validate_agent_plugin.py
