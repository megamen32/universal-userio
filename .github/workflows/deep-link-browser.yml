name: Browser deep links

on:
  pull_request:
    paths:
      - 'src/universal_userio/http_api.py'
      - 'src/universal_userio/search.py'
      - 'src/universal_userio/static/landing.html'
      - 'web/universal-userio-web/**'
      - '.github/workflows/deep-link-browser.yml'

permissions:
  contents: read

jobs:
  deep-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]'
      - run: npm ci --prefix web/universal-userio-web
      - run: npx --prefix web/universal-userio-web playwright install --with-deps chromium
      - run: npm run build --prefix web/universal-userio-web
      - run: NODE_PATH=web/universal-userio-web/node_modules node tests/e2e/deep-link.cjs
