name: Build private voice image

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character published commit SHA to build
        required: true
        type: string
        default: 444ce6c18cd633c81aece5a4e2306fc1b8b4984f

permissions:
  contents: read
  packages: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      image: ${{ steps.source.outputs.image }}
      digest: ${{ steps.result.outputs.digest }}
    defaults:
      run:
        shell: bash
    env:
      IMAGE: ghcr.io/megamen32/universal-userio-voice
    steps:
      - name: Validate source before checkout
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/voice-docker-auth" >> "$GITHUB_ENV"
          [[ "$GITHUB_REPOSITORY" == 'megamen32/universal-userio' ]] || {
            echo '::error::This workflow may publish only from megamen32/universal-userio.'
            exit 1
          }
          [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo '::error::commit_sha must be a full 40-character hexadecimal commit SHA.'
            exit 1
          }
          sha="${REQUESTED_SHA,,}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE:sha-$sha" >> "$GITHUB_OUTPUT"

      - name: Require private package before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The owner bootstraps a private package before dispatch. Do not link it
          # to the public source repository or change either visibility here.
          cat > "$RUNNER_TEMP/voice-package-visibility.py" <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          phase = sys.argv[1]
          if not os.environ.get("GH_TOKEN"):
              sys.exit("GITHUB_TOKEN is required; refusing to proceed.")
          url = "https://api.github.com/users/megamen32/packages/container/universal-userio-voice"
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          for attempt in range(5 if phase == "after" else 1):
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      package = json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404 and phase == "after" and attempt < 4:
                      time.sleep(3)
                      continue
                  sys.exit(f"Package visibility check failed (HTTP {exc.code}); refusing to proceed.")
              except (OSError, ValueError):
                  sys.exit("Package visibility could not be verified; refusing to proceed.")
              if package.get("visibility") != "private":
                  sys.exit("Package is not private; refusing to proceed. No visibility change attempted.")
              print("Package visibility verified: private.")
              break
          PY
          python3 "$RUNNER_TEMP/voice-package-visibility.py" before

      - name: Check out exact published source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify checkout identity
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git cat-file -e "$SOURCE_SHA^{commit}"

      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push tracked source only
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          IMAGE_TAG: ${{ steps.source.outputs.image }}
        run: |
          docker buildx create --name "voice-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --driver docker-container --use
          # An archive of the selected commit excludes .git, credentials and all WIP.
          git archive --format=tar "$SOURCE_SHA" | docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile \
            --target voice \
            --tag "$IMAGE_TAG" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --metadata-file "$RUNNER_TEMP/voice-build-metadata.json" \
            --push -

      - name: Verify private visibility and report digest
        id: result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.source.outputs.image }}
        run: |
          python3 "$RUNNER_TEMP/voice-package-visibility.py" after
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          metadata = json.loads((Path(os.environ["RUNNER_TEMP"]) / "voice-build-metadata.json").read_text())
          digest = metadata["containerimage.digest"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Invalid image digest in Buildx metadata")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"digest={digest}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Image: `{os.environ['IMAGE_TAG']}`\n\nDigest: `{digest}`\n\nVisibility: **private** (API verified).\n")
          PY

      - name: Remove runner credentials and builder
        if: always()
        run: |
          if [[ -n "${DOCKER_CONFIG:-}" ]]; then
            docker logout ghcr.io || true
            rm -rf -- "$DOCKER_CONFIG"
          fi
          docker buildx rm "voice-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" || true
