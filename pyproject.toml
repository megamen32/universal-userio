[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-userio"
version = "0.1.0"
description = "Business control plane for AI-assisted cross-channel conversations"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
universal-userio = "universal_userio.runtime:main"

[project.optional-dependencies]
telegram = ["telethon>=1.42,<2", "pydantic>=2"]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
